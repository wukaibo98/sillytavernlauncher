[package]
name = "tavern-deepseek-launcher"
version = "2.0.0"
description = "Tavern Deepseek - SillyTavern 启动管理器（飞牛 fnOS 移植版）。基于 al01cn/sillytavern-launcher 和 leigegehaha/sillytavernlauncher 的中世纪酒馆风格管理器。"
authors = ["磊哥哥"]
edition = "2021"

[dependencies]
# Web server
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls", "gzip"] }

# Archive handling
zip = "0.6.3"
tar = "0.4"
flate2 = "1.0"
sevenz-rust = "0.6.1"

# Async & utilities
futures-util = "0.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# System info
sys-locale = "0.3.2"
libc = "0.2"
walkdir = "2.5.0"
rayon = "1.11"
sysinfo = "0.38"
num_cpus = "1.17"
jwalk = "0.8"
get_if_addrs = "0.5"
dirs = "6.0"

# Misc
regex = "1"
catch-unwind = "0.3"
indicatif = "0.18"
